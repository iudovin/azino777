services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: datastack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d datastack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Слой витрин (dm) в ClickHouse. Инициализируется скриптами из ./clickhouse/init
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    hostname: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user admin --password admin --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka (KRaft, без Zookeeper) для стриминговой загрузки CSV -> PostgreSQL
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Одноразовый init-контейнер Airflow (накатывает миграции, создает юзера и connection)
  airflow-init:
    image: apache/airflow:2.9.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres/datastack
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dm}
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com &&
      airflow connections add 'postgres_conn' --conn-type 'postgres' --conn-host 'postgres' --conn-schema 'datastack' --conn-login 'admin' --conn-password 'admin' --conn-port 5432 &&
      airflow connections add 'clickhouse_conn' --conn-type 'clickhouse' --conn-host \"\$${CLICKHOUSE_HOST}\" --conn-port \$${CLICKHOUSE_PORT} --conn-login \"\$${CLICKHOUSE_USER}\" --conn-password \"\$${CLICKHOUSE_PASSWORD}\" --conn-schema \"\$${CLICKHOUSE_DB}\"
      "

  # Основной сервис Airflow
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres/datastack
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: bash -c "airflow webserver & airflow scheduler"
    
  # Сервис инициализации: миграции, создание админа и импорт архива
  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: 'super_secret_key_67'
    volumes:
      - superset_home:/app/superset_home
      - ./superset_assets:/app/superset_assets # <--- Проброс папки с архивом
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname Admin --email admin@example.com --password admin &&
      superset init &&
      if [ -f /app/superset_assets/dashboard_export.zip ]; then
        superset import-dashboards -p /app/superset_assets/dashboard_export.zip --username admin
      fi
      "

  # Основной веб-сервер Superset
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: 'super_secret_key_67'
    volumes:
      - superset_home:/app/superset_home
      - ./superset_assets:/app/superset_assets # <--- Доступен и в основном контейнере
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  superset_home: